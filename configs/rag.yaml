chunking:
  size: ${CHUNK_SIZE:1200}
  overlap: ${CHUNK_OVERLAP:200}
  strategies: ["semantic", "window"]
parsing:
  ocr: ${ENABLE_OCR:true}
  table_parser: ${ENABLE_TABLE_PARSER:true}
retrieval:
  mix: ${RETRIEVER_MIX:hybrid}          # bm25 | vector | hybrid
  bm25:
    enable: true
  vector:
    store: ${VECTOR_STORE:chroma}       # chroma | pgvector
    chroma:
      path: ${CHROMA_DIR:./data/vectors/chroma}
  reranker:
    name: ${RERANKER:none}              # none | bge-reranker | cross-encoder
models:
  embedding:
    backend: ${EMBEDDING_BACKEND:local}
    model: ${EMBEDDING_MODEL:bge-base-en-v1.5}
  llm:
    backend: ${LLM_BACKEND:local}
    model: ${LLM_MODEL:llama3.1:8b}
